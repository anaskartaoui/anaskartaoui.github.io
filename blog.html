<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Moul Casquette Explains — approachable notes on machine learning, deep learning, and computer science by Anas Kartaoui." />
  <title>Moul Casquette Explains · Anas Kartaoui</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/dreampulse/computer-modern-web-font@master/fonts.css" />
  <link rel="icon" type="image/png" href="icon.png" />
  <style>
    :root {
      --cream: #faf8f2;
      --ink: #1a1a1a;
      --muted: #555;
      --rule: #c8c0aa;
      --accent: #2c5282;
      --max-w: 920px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--cream);
      color: var(--ink);
      font-family: "Computer Modern Serif", "CMU Serif", Georgia, serif;
      font-size: 19px;
      line-height: 1.75;
    }
    nav {
      display: flex;
      justify-content: center;
      gap: 2rem;
      padding: 1.2rem 2rem;
      border-bottom: 1px solid var(--rule);
      font-size: 16px;
      letter-spacing: .04em;
    }
    nav a { color: var(--muted); text-decoration: none; }
    nav a:hover { color: var(--ink); }
    .page {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 3rem 2rem 6rem;
    }
    .hero {
      display: grid;
      grid-template-columns: 1fr 260px;
      gap: 3rem;
      align-items: center;
      padding: 3rem 0;
      border-bottom: 1.5px solid var(--ink);
    }
    .eyebrow {
      color: var(--muted);
      font-size: 16px;
      font-variant: small-caps;
      letter-spacing: .1em;
      margin-bottom: .5rem;
    }
    h1 {
      font-size: 2.7rem;
      font-weight: normal;
      line-height: 1.1;
      margin-bottom: 1rem;
    }
    .intro { color: var(--muted); font-size: 1.05rem; }
    .character {
      width: 260px;
      height: 260px;
      object-fit: cover;
      object-position: 50% 27%;
      background: #faf8f2;
    }
    .articles { margin-top: 3rem; }
    .articles h2 {
      font-size: 1.3rem;
      font-weight: normal;
      font-variant: small-caps;
      letter-spacing: .08em;
      border-bottom: .5px solid var(--rule);
      padding-bottom: .4rem;
      margin-bottom: 1.4rem;
    }
    .article-card {
      display: grid;
      grid-template-columns: 115px 1fr;
      gap: 1.5rem;
      padding: 1.4rem 0;
      border-bottom: 1px solid var(--rule);
    }
    .article-meta { color: var(--muted); font-size: 16px; }
    .article-card h3 { font-size: 1.2rem; font-weight: normal; margin-bottom: .35rem; }
    .article-card p { color: var(--muted); }
    .status {
      display: inline-block;
      margin-top: .7rem;
      color: var(--accent);
      font-size: 16px;
    }
    footer {
      margin-top: 5rem;
      border-top: .5px solid var(--rule);
      padding-top: 1.2rem;
      text-align: center;
      color: var(--muted);
      font-style: italic;
    }
    @media (max-width: 650px) {
      .hero { grid-template-columns: 1fr; text-align: center; }
      .character { grid-row: 1; margin: 0 auto; width: 210px; height: 210px; }
      h1 { font-size: 2.15rem; }
      .article-card { grid-template-columns: 1fr; gap: .25rem; }
    }
  </style>
</head>



<body>
  <nav>
    <a href="index.html">← Portfolio</a>
    <a href="#articles">Articles</a>
  </nav>

  <main class="page">
    <header class="hero">
      <div>
        <p class="eyebrow">Anas Kartaoui's learning blog</p>
        <h1>Moul Casquette Explains</h1>
        <p class="intro">
          Machine learning, deep learning, and computer science concepts explained
          as I learn them—one idea at a time.
        </p>
      </div>
      <img class="character" src="character.png" alt="Moul Casquette saying hello" />
    </header>

    <section class="articles" id="articles">
      <h2>Latest Notes</h2>
      <div id="post-list"></div>
    </section>

    <footer>Learn it. Question it. Explain it simply.</footer>
  </main>
  <script>
    async function loadPosts() {
      const list = document.getElementById("post-list");

      try {
        const response = await fetch("posts/index.json");

        if (!response.ok) {
          throw new Error("Impossible de charger les articles.");
        }

        const posts = await response.json();

        for (const post of posts) {
          const card = document.createElement("article");
          card.className = "article-card";

          const date = document.createElement("div");
          date.className = "article-meta";
          date.textContent = post.date;

          const content = document.createElement("div");

          const title = document.createElement("h3");

          const link = document.createElement("a");
          link.href = `article.html?post=${encodeURIComponent(post.slug)}`;
          link.textContent = post.title;

          title.append(link);

          const description = document.createElement("p");
          description.textContent = post.description;

          content.append(title, description);
          card.append(date, content);
          list.append(card);
        }
      } catch (error) {
        list.textContent = "Impossible de charger les articles.";
        console.error(error);
      }
    }

    loadPosts();
  </script>
</body>
</html>
